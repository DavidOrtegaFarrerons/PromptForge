info:
  name: Login
  type: http
  seq: 3

http:
  method: POST
  url: "{{api-gateway-domain}}/{{auth-endpoint}}/register"
  body:
    type: json
    data: |-
      {
        "username": "david",
        "email": "david@example.com",
        "password": "secret"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
