services:
  api-gateway:
    build:
      context: ../services/api-gateway
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      AUTHENTICATION_TOKEN_SECRET: "example_token_secret"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      BILLING_SERVICE_URL: "http://billing-service:8082"
      CONTENT_SERVICE_URL: "http://content-service:8083"
    depends_on:
      - auth-service
      - content-service
      - billing-service

  auth-service:
    build:
      context: ../services/auth-service
    environment:
      ADDR: ":8081"
      AUTH_DATABASE_DSN: "postgres://auth_user:auth_password@auth-db:5432/auth_service?sslmode=disable"
      AUTH_MIGRATIONS_PATH: "file://migrations"
      TOKEN_SECRET: "example_token_secret"
      AMQP_USER: guest
      AMQP_PASSWORD: guest
      AMQP_HOST: rabbitmq:5672
    expose:
      - "8081"
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth_service
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auth_user -d auth_service" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  billing-service:
    build:
      context: ../
      dockerfile: services/billing-service/Dockerfile
    environment:
      ADDR: ":8082"
      BILLING_DATABASE_DSN: "postgres://billing_user:billing_password@billing-db:5432/billing_service?sslmode=disable"
      BILLING_MIGRATIONS_PATH: "file://migrations"
      AMQP_USER: guest
      AMQP_PASSWORD: guest
      AMQP_HOST: rabbitmq:5672
    expose:
      - "8082"
      - "9091"
    depends_on:
      billing-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  billing-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password
      POSTGRES_DB: billing_service
    ports:
      - "5435:5432"
    volumes:
      - billing-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U billing_user -d billing_service" ]
      interval: 5s
      timeout: 5s
      retries: 5

  content-service:
    build:
      context: ../
      dockerfile: services/content-service/Dockerfile
    environment:
      ADDR: ":8083"
      CONTENT_DATABASE_DSN: "postgres://content_user:content_password@content-db:5432/content_service?sslmode=disable"
      CONTENT_MIGRATIONS_PATH: "file://migrations"
      BILLING_GRPC_ADDR: "billing-service:9091"
    expose:
      - "8083"
    depends_on:
      content-db:
        condition: service_healthy
      billing-service:
        condition: service_started

  content-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: content_user
      POSTGRES_PASSWORD: content_password
      POSTGRES_DB: content_service
    ports:
      - "5434:5432"
    volumes:
      - content-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U content_user -d content_service" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auth-db-data:
  billing-db-data:
  content-db-data:
  rabbitmq-data: