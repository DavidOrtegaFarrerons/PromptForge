services:
  api-gateway:
    build:
      context: ../services/api-gateway
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      BILLING_SERVICE_URL: "http://billing-service:8082"
      CONTENT_SERVICE_URL: "http://content-service:8083"
    depends_on:
      - auth-service
      - content-service
      - billing-service

  auth-service:
    build:
      context: ../services/auth-service
    environment:
      ADDR: ":8081"
      AUTH_DATABASE_DSN: "postgres://auth_user:auth_password@auth-db:5432/auth_service?sslmode=disable"
      AUTH_MIGRATIONS_PATH: "file://migrations"
      TOKEN_SECRET: "example_token_secret"
    expose:
      - "8081"
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth_service
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auth_user -d auth_service" ]
      interval: 5s
      timeout: 5s
      retries: 5

  billing-service:
    build:
      context: ../services/billing-service
    environment:
      ADDR: ":8082"
    expose:
      - "8082"

  content-service:
    build:
      context: ../services/content-service
    environment:
      ADDR: ":8083"
    expose:
      - "8083"

volumes:
  auth-db-data: