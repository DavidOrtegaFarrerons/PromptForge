services:
  api-gateway:
    build:
      context: ../services/api-gateway
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      BILLING_SERVICE_URL: "http://billing-service:8082"
      CONTENT_SERVICE_URL: "http://content-service:8083"
    depends_on:
      - auth-service
      - content-service
      - billing-service

  auth-service:
    build:
      context: ../services/auth-service
    environment:
      ADDR: ":8081"
    expose:
      - "8081"

  billing-service:
    build:
      context: ../services/billing-service
    environment:
      ADDR: ":8082"
    expose:
      - "8082"

  content-service:
    build:
      context: ../services/content-service
    environment:
      ADDR: ":8083"
    expose:
      - "8083"